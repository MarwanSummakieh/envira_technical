[project]
name = "envira-exposure"
version = "0.1.0"
description = "Small Danish asset rainfall exposure service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pandas>=2.2,<3",
    "pyproj>=3.6,<4",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
